<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="soilGrad3" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#77594B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4A3A;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="stemGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2FD4A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C896;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="leafGrad3">
      <stop offset="0%" style="stop-color:#4FFFB0;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </radialGradient>

    <filter id="softShadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="leafShadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFF8F0"/>

  <!-- Soil -->
  <g filter="url(#softShadow3)">
    <ellipse cx="200" cy="320" rx="96" ry="34" fill="url(#soilGrad3)"/>
    <ellipse cx="200" cy="313" rx="80" ry="8" fill="#9A8169" opacity="0.4"/>
  </g>

  <!-- Plant with 3 leaves -->
  <g>
    <!-- Main stem -->
    <path d="M 200,315 Q 198,285 200,255"
          stroke="url(#stemGrad3)"
          stroke-width="3.5"
          fill="none"
          stroke-linecap="round"/>

    <!-- Left leaf (bottom) -->
    <g filter="url(#leafShadow3)">
      <path d="M 200,290 Q 180,288 170,280 Q 166,274 170,268 Q 180,260 200,265 Z"
            fill="url(#leafGrad3)"/>
      <path d="M 200,290 Q 188,283 180,273" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M 190,285 L 182,281" stroke="#00A577" stroke-width="0.5" fill="none" opacity="0.4"/>
      <path d="M 185,278 L 178,275" stroke="#00A577" stroke-width="0.5" fill="none" opacity="0.4"/>
      <ellipse cx="185" cy="277" rx="5" ry="4" fill="#80FFD4" opacity="0.35" transform="rotate(-35 185 277)"/>
    </g>

    <!-- Right leaf (bottom) -->
    <g filter="url(#leafShadow3)">
      <path d="M 200,290 Q 220,288 230,280 Q 234,274 230,268 Q 220,260 200,265 Z"
            fill="url(#leafGrad3)"/>
      <path d="M 200,290 Q 212,283 220,273" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M 210,285 L 218,281" stroke="#00A577" stroke-width="0.5" fill="none" opacity="0.4"/>
      <path d="M 215,278 L 222,275" stroke="#00A577" stroke-width="0.5" fill="none" opacity="0.4"/>
      <ellipse cx="215" cy="277" rx="5" ry="4" fill="#80FFD4" opacity="0.35" transform="rotate(35 215 277)"/>
    </g>

    <!-- Top leaf (smaller) -->
    <g filter="url(#leafShadow3)">
      <path d="M 200,260 Q 187,258 182,252 Q 180,248 182,244 Q 187,240 200,242 Z"
            fill="url(#leafGrad3)"/>
      <path d="M 200,260 Q 192,255 188,248" stroke="#00A577" stroke-width="0.7" fill="none" opacity="0.5"/>
      <ellipse cx="192" cy="250" rx="4" ry="3" fill="#80FFD4" opacity="0.4" transform="rotate(-30 192 250)"/>
    </g>
  </g>

  <!-- Growing bud at top -->
  <circle cx="200" cy="255" r="2.5" fill="#4FFFB0" opacity="0.7"/>
  <circle cx="200" cy="253" r="1.5" fill="#80FFD4" opacity="0.6"/>
</svg>

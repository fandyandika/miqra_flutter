<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="soilGrad10" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#77594B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4A3A;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="trunkGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00A577;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="canopyGrad10">
      <stop offset="0%" style="stop-color:#4FFFB0;stop-opacity:0.75" />
      <stop offset="30%" style="stop-color:#00C896;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="leafGrad10">
      <stop offset="0%" style="stop-color:#4FFFB0;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="fruitGrad10">
      <stop offset="0%" style="stop-color:#FFB399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8A65;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67352;stop-opacity:1" />
    </radialGradient>

    <filter id="softShadow10">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="leafShadow10">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFF8F0"/>

  <!-- Soil -->
  <g filter="url(#softShadow10)">
    <ellipse cx="200" cy="320" rx="110" ry="41" fill="url(#soilGrad10)"/>
    <ellipse cx="200" cy="313" rx="94" ry="9" fill="#9A8169" opacity="0.4"/>
  </g>

  <!-- Near final tree - large, majestic -->
  <g>
    <!-- Robust trunk -->
    <path d="M 200,315 Q 198,250 200,145"
          stroke="url(#trunkGrad10)"
          stroke-width="10"
          fill="none"
          stroke-linecap="round"/>

    <!-- Very large canopy base -->
    <ellipse cx="200" cy="185" rx="80" ry="88" fill="url(#canopyGrad10)" opacity="0.16" filter="url(#softShadow10)"/>

    <!-- 30 leaves - dense, beautiful canopy -->
    <!-- Outermost layer (6 leaves) -->
    <g filter="url(#leafShadow10)">
      <ellipse cx="120" cy="260" rx="18" ry="22" fill="url(#leafGrad10)" transform="rotate(-40 120 260)"/>
      <path d="M 120,260 L 128,246" stroke="#00A577" stroke-width="1.3" fill="none" opacity="0.4"/>
      <ellipse cx="128" cy="250" rx="7" ry="5.5" fill="#80FFD4" opacity="0.3"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="280" cy="260" rx="18" ry="22" fill="url(#leafGrad10)" transform="rotate(40 280 260)"/>
      <path d="M 280,260 L 272,246" stroke="#00A577" stroke-width="1.3" fill="none" opacity="0.4"/>
      <ellipse cx="272" cy="250" rx="7" ry="5.5" fill="#80FFD4" opacity="0.3"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="138" cy="244" rx="17" ry="21" fill="url(#leafGrad10)" transform="rotate(-35 138 244)"/>
      <ellipse cx="145" cy="236" rx="6" ry="5" fill="#80FFD4" opacity="0.32"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="262" cy="244" rx="17" ry="21" fill="url(#leafGrad10)" transform="rotate(35 262 244)"/>
      <ellipse cx="255" cy="236" rx="6" ry="5" fill="#80FFD4" opacity="0.32"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="152" cy="227" rx="16" ry="20" fill="url(#leafGrad10)" transform="rotate(-30 152 227)"/>
      <path d="M 152,227 L 157,216" stroke="#00A577" stroke-width="1.2" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="248" cy="227" rx="16" ry="20" fill="url(#leafGrad10)" transform="rotate(30 248 227)"/>
      <path d="M 248,227 L 243,216" stroke="#00A577" stroke-width="1.2" fill="none" opacity="0.4"/>
    </g>

    <!-- Second layer (6 leaves) -->
    <g filter="url(#leafShadow10)">
      <ellipse cx="162" cy="210" rx="15" ry="19" fill="url(#leafGrad10)" transform="rotate(-24 162 210)"/>
      <ellipse cx="166" cy="202" rx="5.5" ry="4.5" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="238" cy="210" rx="15" ry="19" fill="url(#leafGrad10)" transform="rotate(24 238 210)"/>
      <ellipse cx="234" cy="202" rx="5.5" ry="4.5" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="170" cy="194" rx="14" ry="18" fill="url(#leafGrad10)" transform="rotate(-19 170 194)"/>
      <path d="M 170,194 L 173,185" stroke="#00A577" stroke-width="1.1" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="230" cy="194" rx="14" ry="18" fill="url(#leafGrad10)" transform="rotate(19 230 194)"/>
      <path d="M 230,194 L 227,185" stroke="#00A577" stroke-width="1.1" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="177" cy="179" rx="13" ry="17" fill="url(#leafGrad10)" transform="rotate(-16 177 179)"/>
      <ellipse cx="180" cy="173" rx="5" ry="4" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="223" cy="179" rx="13" ry="17" fill="url(#leafGrad10)" transform="rotate(16 223 179)"/>
      <ellipse cx="220" cy="173" rx="5" ry="4" fill="#80FFD4" opacity="0.35"/>
    </g>

    <!-- Third layer (6 leaves) -->
    <g filter="url(#leafShadow10)">
      <ellipse cx="184" cy="165" rx="12" ry="16" fill="url(#leafGrad10)" transform="rotate(-13 184 165)"/>
      <path d="M 184,165 L 186,157" stroke="#00A577" stroke-width="1" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="216" cy="165" rx="12" ry="16" fill="url(#leafGrad10)" transform="rotate(13 216 165)"/>
      <path d="M 216,165 L 214,157" stroke="#00A577" stroke-width="1" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="189" cy="152" rx="11.5" ry="15" fill="url(#leafGrad10)" transform="rotate(-11 189 152)"/>
      <ellipse cx="191" cy="146" rx="4.5" ry="3.5" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="211" cy="152" rx="11.5" ry="15" fill="url(#leafGrad10)" transform="rotate(11 211 152)"/>
      <ellipse cx="209" cy="146" rx="4.5" ry="3.5" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="193" cy="140" rx="11" ry="14" fill="url(#leafGrad10)" transform="rotate(-9 193 140)"/>
      <path d="M 193,140 L 194,132" stroke="#00A577" stroke-width="0.9" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="207" cy="140" rx="11" ry="14" fill="url(#leafGrad10)" transform="rotate(9 207 140)"/>
      <path d="M 207,140 L 206,132" stroke="#00A577" stroke-width="0.9" fill="none" opacity="0.4"/>
    </g>

    <!-- Fourth layer (6 leaves) -->
    <g filter="url(#leafShadow10)">
      <ellipse cx="195" cy="129" rx="10" ry="13" fill="url(#leafGrad10)" transform="rotate(-7 195 129)"/>
      <ellipse cx="196" cy="124" rx="4" ry="3" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="205" cy="129" rx="10" ry="13" fill="url(#leafGrad10)" transform="rotate(7 205 129)"/>
      <ellipse cx="204" cy="124" rx="4" ry="3" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="196" cy="119" rx="9.5" ry="12.5" fill="url(#leafGrad10)" transform="rotate(-5 196 119)"/>
      <path d="M 196,119 L 197,112" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="204" cy="119" rx="9.5" ry="12.5" fill="url(#leafGrad10)" transform="rotate(5 204 119)"/>
      <path d="M 204,119 L 203,112" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="197" cy="109" rx="9" ry="12" fill="url(#leafGrad10)" transform="rotate(-3 197 109)"/>
      <ellipse cx="198" cy="105" rx="3.5" ry="2.5" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="203" cy="109" rx="9" ry="12" fill="url(#leafGrad10)" transform="rotate(3 203 109)"/>
      <ellipse cx="202" cy="105" rx="3.5" ry="2.5" fill="#80FFD4" opacity="0.35"/>
    </g>

    <!-- Crown layer (6 leaves) -->
    <g filter="url(#leafShadow10)">
      <ellipse cx="198" cy="100" rx="8.5" ry="11" fill="url(#leafGrad10)" transform="rotate(-2 198 100)"/>
      <path d="M 198,100 L 198,94" stroke="#00A577" stroke-width="0.7" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="202" cy="100" rx="8.5" ry="11" fill="url(#leafGrad10)" transform="rotate(2 202 100)"/>
      <path d="M 202,100 L 202,94" stroke="#00A577" stroke-width="0.7" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="198.5" cy="92" rx="8" ry="10.5" fill="url(#leafGrad10)" transform="rotate(-1 198.5 92)"/>
      <ellipse cx="199" cy="88" rx="3" ry="2" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="201.5" cy="92" rx="8" ry="10.5" fill="url(#leafGrad10)" transform="rotate(1 201.5 92)"/>
      <ellipse cx="201" cy="88" rx="3" ry="2" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="199" cy="85" rx="7.5" ry="10" fill="url(#leafGrad10)"/>
    </g>
    <g filter="url(#leafShadow10)">
      <ellipse cx="201" cy="85" rx="7.5" ry="10" fill="url(#leafGrad10)"/>
    </g>

    <!-- 6 Fruits beautifully distributed -->
    <g filter="url(#leafShadow10)">
      <circle cx="156" cy="220" r="8" fill="url(#fruitGrad10)"/>
      <ellipse cx="154" cy="218" rx="3.5" ry="2.6" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow10)">
      <circle cx="244" cy="220" r="8" fill="url(#fruitGrad10)"/>
      <ellipse cx="242" cy="218" rx="3.5" ry="2.6" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow10)">
      <circle cx="174" cy="195" r="7.5" fill="url(#fruitGrad10)"/>
      <ellipse cx="172" cy="193" rx="3.2" ry="2.4" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow10)">
      <circle cx="226" cy="195" r="7.5" fill="url(#fruitGrad10)"/>
      <ellipse cx="224" cy="193" rx="3.2" ry="2.4" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow10)">
      <circle cx="190" cy="172" r="7" fill="url(#fruitGrad10)"/>
      <ellipse cx="188" cy="170" rx="3" ry="2.2" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow10)">
      <circle cx="210" cy="172" r="7" fill="url(#fruitGrad10)"/>
      <ellipse cx="208" cy="170" rx="3" ry="2.2" fill="#FFD4C0" opacity="0.7"/>
    </g>
  </g>
</svg>

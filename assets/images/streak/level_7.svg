<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="soilGrad7" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#77594B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4A3A;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="trunkGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00A577;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C896;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="canopyGrad">
      <stop offset="0%" style="stop-color:#4FFFB0;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#00C896;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="leafGrad7">
      <stop offset="0%" style="stop-color:#4FFFB0;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="fruitGrad7">
      <stop offset="0%" style="stop-color:#FFB399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8A65;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67352;stop-opacity:1" />
    </radialGradient>

    <filter id="softShadow7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="leafShadow7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFF8F0"/>

  <!-- Soil -->
  <g filter="url(#softShadow7)">
    <ellipse cx="200" cy="320" rx="104" ry="38" fill="url(#soilGrad7)"/>
    <ellipse cx="200" cy="313" rx="88" ry="8" fill="#9A8169" opacity="0.4"/>
  </g>

  <!-- Growing tree with fuller canopy -->
  <g>
    <!-- Trunk -->
    <path d="M 200,315 Q 198,265 200,175"
          stroke="url(#trunkGrad7)"
          stroke-width="7"
          fill="none"
          stroke-linecap="round"/>

    <!-- Canopy base shape (subtle background) -->
    <ellipse cx="200" cy="200" rx="55" ry="65" fill="url(#canopyGrad)" opacity="0.15" filter="url(#softShadow7)"/>

    <!-- 14 Detailed leaves in organized layers -->
    <!-- Bottom layer (widest) -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="145" cy="245" rx="15" ry="19" fill="url(#leafGrad7)" transform="rotate(-30 145 245)"/>
      <path d="M 145,245 L 148,235" stroke="#00A577" stroke-width="1" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="255" cy="245" rx="15" ry="19" fill="url(#leafGrad7)" transform="rotate(30 255 245)"/>
      <path d="M 255,245 L 252,235" stroke="#00A577" stroke-width="1" fill="none" opacity="0.4"/>
    </g>

    <!-- Second layer -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="160" cy="228" rx="14" ry="18" fill="url(#leafGrad7)" transform="rotate(-25 160 228)"/>
      <ellipse cx="163" cy="222" rx="5" ry="4" fill="#80FFD4" opacity="0.3"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="240" cy="228" rx="14" ry="18" fill="url(#leafGrad7)" transform="rotate(25 240 228)"/>
      <ellipse cx="237" cy="222" rx="5" ry="4" fill="#80FFD4" opacity="0.3"/>
    </g>

    <!-- Third layer -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="172" cy="210" rx="13" ry="17" fill="url(#leafGrad7)" transform="rotate(-20 172 210)"/>
      <path d="M 172,210 L 174,202" stroke="#00A577" stroke-width="0.9" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="228" cy="210" rx="13" ry="17" fill="url(#leafGrad7)" transform="rotate(20 228 210)"/>
      <path d="M 228,210 L 226,202" stroke="#00A577" stroke-width="0.9" fill="none" opacity="0.4"/>
    </g>

    <!-- Fourth layer (mid) -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="182" cy="192" rx="12" ry="16" fill="url(#leafGrad7)" transform="rotate(-15 182 192)"/>
      <ellipse cx="184" cy="187" rx="4" ry="3" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="218" cy="192" rx="12" ry="16" fill="url(#leafGrad7)" transform="rotate(15 218 192)"/>
      <ellipse cx="216" cy="187" rx="4" ry="3" fill="#80FFD4" opacity="0.35"/>
    </g>

    <!-- Fifth layer -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="190" cy="176" rx="11" ry="15" fill="url(#leafGrad7)" transform="rotate(-10 190 176)"/>
      <path d="M 190,176 L 191,169" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.4"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="210" cy="176" rx="11" ry="15" fill="url(#leafGrad7)" transform="rotate(10 210 176)"/>
      <path d="M 210,176 L 209,169" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.4"/>
    </g>

    <!-- Sixth layer (top area) -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="195" cy="162" rx="10" ry="14" fill="url(#leafGrad7)" transform="rotate(-8 195 162)"/>
      <ellipse cx="196" cy="158" rx="3" ry="2" fill="#80FFD4" opacity="0.35"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="205" cy="162" rx="10" ry="14" fill="url(#leafGrad7)" transform="rotate(8 205 162)"/>
      <ellipse cx="204" cy="158" rx="3" ry="2" fill="#80FFD4" opacity="0.35"/>
    </g>

    <!-- Top leaves (crown) -->
    <g filter="url(#leafShadow7)">
      <ellipse cx="197" cy="150" rx="9" ry="12" fill="url(#leafGrad7)" transform="rotate(-5 197 150)"/>
    </g>
    <g filter="url(#leafShadow7)">
      <ellipse cx="203" cy="150" rx="9" ry="12" fill="url(#leafGrad7)" transform="rotate(5 203 150)"/>
    </g>

    <!-- 3 Fruits -->
    <g filter="url(#leafShadow7)">
      <circle cx="175" cy="205" r="6.5" fill="url(#fruitGrad7)"/>
      <ellipse cx="173" cy="203" rx="2.7" ry="2" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow7)">
      <circle cx="225" cy="205" r="6.5" fill="url(#fruitGrad7)"/>
      <ellipse cx="223" cy="203" rx="2.7" ry="2" fill="#FFD4C0" opacity="0.7"/>
    </g>
    <g filter="url(#leafShadow7)">
      <circle cx="200" cy="185" r="6" fill="url(#fruitGrad7)"/>
      <ellipse cx="198" cy="183" rx="2.5" ry="1.8" fill="#FFD4C0" opacity="0.7"/>
    </g>
  </g>
</svg>

<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="soilGrad4" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#77594B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4A3A;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="stemGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2FD4A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C896;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="leafGrad4">
      <stop offset="0%" style="stop-color:#4FFFB0;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A577;stop-opacity:1" />
    </radialGradient>

    <!-- Fruit gradient (Sunrise Coral) -->
    <radialGradient id="fruitGrad">
      <stop offset="0%" style="stop-color:#FFB399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8A65;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67352;stop-opacity:1" />
    </radialGradient>

    <filter id="softShadow4">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="leafShadow4">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFF8F0"/>

  <!-- Soil -->
  <g filter="url(#softShadow4)">
    <ellipse cx="200" cy="320" rx="98" ry="35" fill="url(#soilGrad4)"/>
    <ellipse cx="200" cy="313" rx="82" ry="8" fill="#9A8169" opacity="0.4"/>
  </g>

  <!-- Plant with 5 leaves and 1 fruit -->
  <g>
    <!-- Main stem (thicker) -->
    <path d="M 200,315 Q 198,280 200,230"
          stroke="url(#stemGrad4)"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>

    <!-- Leaf 1 (bottom left) -->
    <g filter="url(#leafShadow4)">
      <path d="M 200,295 Q 175,292 163,282 Q 158,275 163,268 Q 175,258 200,263 Z"
            fill="url(#leafGrad4)"/>
      <path d="M 200,295 Q 183,287 172,275" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M 188,288 L 178,283" stroke="#00A577" stroke-width="0.5" fill="none" opacity="0.4"/>
      <ellipse cx="180" cy="280" rx="6" ry="4" fill="#80FFD4" opacity="0.35" transform="rotate(-35 180 280)"/>
    </g>

    <!-- Leaf 2 (bottom right) -->
    <g filter="url(#leafShadow4)">
      <path d="M 200,295 Q 225,292 237,282 Q 242,275 237,268 Q 225,258 200,263 Z"
            fill="url(#leafGrad4)"/>
      <path d="M 200,295 Q 217,287 228,275" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M 212,288 L 222,283" stroke="#00A577" stroke-width="0.5" fill="none" opacity="0.4"/>
      <ellipse cx="220" cy="280" rx="6" ry="4" fill="#80FFD4" opacity="0.35" transform="rotate(35 220 280)"/>
    </g>

    <!-- Leaf 3 (mid left) -->
    <g filter="url(#leafShadow4)">
      <path d="M 200,270 Q 182,268 172,260 Q 168,255 172,250 Q 182,243 200,247 Z"
            fill="url(#leafGrad4)"/>
      <path d="M 200,270 Q 188,263 180,253" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.5"/>
      <ellipse cx="187" cy="258" rx="5" ry="4" fill="#80FFD4" opacity="0.35" transform="rotate(-35 187 258)"/>
    </g>

    <!-- Leaf 4 (mid right) -->
    <g filter="url(#leafShadow4)">
      <path d="M 200,270 Q 218,268 228,260 Q 232,255 228,250 Q 218,243 200,247 Z"
            fill="url(#leafGrad4)"/>
      <path d="M 200,270 Q 212,263 220,253" stroke="#00A577" stroke-width="0.8" fill="none" opacity="0.5"/>
      <ellipse cx="213" cy="258" rx="5" ry="4" fill="#80FFD4" opacity="0.35" transform="rotate(35 213 258)"/>
    </g>

    <!-- Leaf 5 (top) -->
    <g filter="url(#leafShadow4)">
      <path d="M 200,245 Q 184,243 176,236 Q 173,231 176,226 Q 184,220 200,223 Z"
            fill="url(#leafGrad4)"/>
      <path d="M 200,245 Q 190,239 184,230" stroke="#00A577" stroke-width="0.7" fill="none" opacity="0.5"/>
      <ellipse cx="190" cy="234" rx="4" ry="3" fill="#80FFD4" opacity="0.4" transform="rotate(-30 190 234)"/>
    </g>

    <!-- FIRST FRUIT! (small, between leaves) -->
    <g filter="url(#leafShadow4)">
      <circle cx="215" cy="265" r="5" fill="url(#fruitGrad)"/>
      <ellipse cx="213" cy="263" rx="2" ry="1.5" fill="#FFD4C0" opacity="0.7"/>
      <circle cx="216" cy="267" r="0.8" fill="#E67352" opacity="0.3"/>
    </g>
  </g>
</svg>

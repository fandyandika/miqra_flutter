<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient untuk soil -->
    <radialGradient id="soilGradient" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#77594B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4A3A;stop-opacity:1" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Texture pattern -->
    <pattern id="soilTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#6B5444" opacity="0.3"/>
      <circle cx="12" cy="8" r="1.5" fill="#5D4A3A" opacity="0.2"/>
      <circle cx="7" cy="15" r="0.8" fill="#8B7355" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8F0"/>

  <!-- Soil mound with texture and gradient -->
  <g filter="url(#softShadow)">
    <!-- Main soil shape -->
    <ellipse cx="200" cy="320" rx="90" ry="30" fill="url(#soilGradient)"/>

    <!-- Texture overlay -->
    <ellipse cx="200" cy="320" rx="90" ry="30" fill="url(#soilTexture)" opacity="0.6"/>

    <!-- Highlight on top -->
    <ellipse cx="200" cy="312" rx="75" ry="8" fill="#9A8169" opacity="0.4"/>

    <!-- Small details - pebbles -->
    <circle cx="160" cy="325" r="2.5" fill="#5D4A3A" opacity="0.6"/>
    <circle cx="220" cy="328" r="2" fill="#6B5444" opacity="0.5"/>
    <circle cx="190" cy="332" r="1.8" fill="#5D4A3A" opacity="0.55"/>
    <ellipse cx="240" cy="322" rx="3" ry="2" fill="#8B7355" opacity="0.45"/>
  </g>

  <!-- Subtle ground line -->
  <line x1="100" y1="350" x2="300" y2="350" stroke="#E5D5C0" stroke-width="0.5" opacity="0.3"/>
</svg>
